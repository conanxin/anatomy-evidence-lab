name: B-tree correctness and build
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: npm run export:provenance
      - run: npm run export:cost
      - run: test -f artifacts/cost-run.jsonld
      - run: test -f artifacts/comparison-run.jsonld
      - run: test -f dist/index.html
      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-btree-static-preview
          path: dist/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-p6-browser-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
