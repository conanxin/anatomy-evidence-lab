name: B-tree correctness and build
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: test -f dist/index.html
      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-btree-static-preview
          path: dist/
