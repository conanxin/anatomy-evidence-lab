name: B-tree correctness and build
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: npm run export:provenance
      - run: npm run export:cost
      - run: npm run analysis:p7
      - run: npm run analysis:p8
      - run: npm run check:skill
      - run: test -f artifacts/p7-sensitivity.csv
      - run: test -f artifacts/p7-sensitivity.json
      - run: test -f artifacts/p8-robustness.json
      - run: test -f artifacts/p8-robustness.csv
      - run: test -f docs/P8_RESULTS.md
      - run: test -f artifacts/cost-run.jsonld
      - run: test -f artifacts/comparison-run.jsonld
      - run: npm run export:source-atlas
      - run: npm run export:source-atlas:p11
      - run: bash -n scripts/p11_agent_runtime_canary.sh
      - run: bash -n scripts/p12_hermes_provider_canary.sh
      - run: npm run export:source-atlas:p12
      - run: test -f artifacts/p12-folio-witnesses.json
      - run: test -f dist/source-atlas-p12.html
      - run: test -f artifacts/p11-edition-candidates.json
      - run: test -f dist/source-atlas-p11.html
      - run: test -f artifacts/p10-source-atlas.json
      - run: test -f dist/source-atlas.html
      - run: test -f dist/jiegao.html
      - run: test -f dist/index.html
      - run: test -f dist/study-static.html
      - run: test -f dist/study-interactive.html
      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-btree-static-preview
          path: |
            dist/
            artifacts/p7-sensitivity.json
            artifacts/p7-sensitivity.csv
            artifacts/p8-robustness.json
            artifacts/p8-robustness.csv

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - run: python scripts/browser_sensitivity.py
      - run: python scripts/browser_robustness.py
      - run: python scripts/browser_jiegao.py
      - run: python scripts/browser_source_atlas.py
      - run: python scripts/browser_p11_atlas.py
      - run: python scripts/browser_p12_atlas.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-p9-browser-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
